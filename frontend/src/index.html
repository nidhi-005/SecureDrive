<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureDrive</title>
  <link rel="stylesheet" href="css/auth.css">
</head>

<body>

  <div id="auth-screen">
    <div class="auth-box">

      <span class="logo">Secure<span>Drive</span></span>

      <h2>Welcome back</h2>
      <p class="subtitle">
        Your files, encrypted before they leave your device.
      </p>

      <div class="tabs">
        <div class="tab active" id="tab-login">Login</div>
        <div class="tab" id="tab-signup">Sign Up</div>
      </div>

      <!-- LOGIN -->
      <div id="login-form">
        <label for="login-email">Email</label>
        <input
          type="email"
          id="login-email"
          placeholder="you@example.com"
          autocomplete="email"
        >

        <label for="login-password">Password</label>
        <input
          type="password"
          id="login-password"
          placeholder="Your password"
          autocomplete="current-password"
        >

        <div class="error-msg" id="login-error"></div>

        <button class="btn-primary" id="login-btn">
          Login
        </button>
      </div>

      <!-- SIGN UP -->
      <div id="signup-form" style="display:none">

        <label for="signup-email">Email</label>
        <input
          type="email"
          id="signup-email"
          placeholder="you@example.com"
          autocomplete="email"
        >

        <label for="signup-password">Password</label>
        <input
          type="password"
          id="signup-password"
          placeholder="Min. 8 characters"
          autocomplete="new-password"
        >

        <div class="error-msg" id="signup-error"></div>

        <button class="btn-primary" id="signup-btn">
          Create Account
        </button>
      </div>

      <div class="auth-note">
        🔒 Your password never leaves your device.<br>
        All encryption uses AES-256-GCM via Web Crypto API.
      </div>

    </div>
  </div>

  <script type="module" src="js/auth.js"></script>

</body>
</html>
